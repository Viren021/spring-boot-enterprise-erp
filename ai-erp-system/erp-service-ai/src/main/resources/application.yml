server:
  port: 8085

spring:
  application:
    name: erp-service-ai

  # 1. Cache Configuration (1 Hour TTL)
  cache:
    type: redis
    redis:
      time-to-live: 1h

  # 2. Redis Connection (Parameterized for Docker!)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 3. Security connection to Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/erp-realm

  # 4. Spring AI Ollama connection (Parameterized for Docker!)
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2
          temperature: 0.7