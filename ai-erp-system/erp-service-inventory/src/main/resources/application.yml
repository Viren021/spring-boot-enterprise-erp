server:
  port: 8083

spring:
  application:
    name: erp-service-inventory

  # 1. Database Connection (Secured with .env placeholders!)
  datasource:
    # Defaults to localhost for your IDE, easily overridden by Docker
    url: ${DB_URL:jdbc:postgresql://localhost:5433/erp_db}
    username: ${DB_USERNAME:erp_superadmin}
    password: ${DB_PASSWORD} # 🌟 Reads from Environment Variables
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Keep migrations opt-in until this service has complete versioned coverage.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    validate-on-migrate: ${FLYWAY_VALIDATE:false}
    clean-disabled: true

  # 2. Redis Connection (Your new cache!)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 3. Keycloak Security
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/erp-realm

  # 4. Kafka Connection (With your Poison Pill fixes!)
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.erp_service_inventory.dto.PaymentEvent