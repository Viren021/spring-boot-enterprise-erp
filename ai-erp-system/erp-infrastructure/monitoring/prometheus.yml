global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  # API Gateway metrics
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8090']
    metrics_path: '/actuator/prometheus'

  # HR Service metrics
  - job_name: 'hr-service'
    static_configs:
      - targets: ['hr-service:8082']
    metrics_path: '/actuator/prometheus'

  # Finance Service metrics
  - job_name: 'finance-service'
    static_configs:
      - targets: ['finance-service:8084']
    metrics_path: '/actuator/prometheus'

  # Inventory Service metrics
  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:8083']
    metrics_path: '/actuator/prometheus'

  # Compliance Service metrics
  - job_name: 'compliance-service'
    static_configs:
      - targets: ['compliance-service:8086']
    metrics_path: '/actuator/prometheus'

  # AI Service metrics
  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:8085']
    metrics_path: '/actuator/prometheus'

  # Procurement Service metrics
  - job_name: 'procurement-service'
    static_configs:
      - targets: ['procurement-service:8087']
    metrics_path: '/actuator/prometheus'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
