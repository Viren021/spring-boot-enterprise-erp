version: '3.8'

services:
  # ==========================================
  # 🏗️ CORE INFRASTRUCTURE
  # ==========================================

  # 1. Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}          # 🌟 Reads from .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # 🌟 Reads from .env
      POSTGRES_DB: erp_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp-network

  # 2. Identity Provider (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: erp-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}         # 🌟 Reads from .env
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD} # 🌟 Reads from .env
    command: start-dev
    ports:
      - "8180:8080"
    depends_on:
      - postgres
    networks:
      - erp-network

  # 3. Event Bus (Kafka + Zookeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: erp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - erp-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: erp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - erp-network

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: erp-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - erp-network

  # 4. Cache (Redis)
  redis:
    image: redis:alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    networks:
      - erp-network

  # 5. Document Database (MongoDB)
  erp-mongodb:
    image: mongo:latest
    container_name: erp-mongodb
    command: [--auth]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}      # 🌟 ADDED: Required for --auth
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}  # 🌟 ADDED: Reads from .env
    ports:
      - "27017:27017"
    volumes:
      - erp_mongo_data:/data/db
    networks:
      - erp-network
    restart: unless-stopped


  # ==========================================
  # 🚀 YOUR MICROSERVICES
  # ==========================================

  # Example: Inventory Service
  # inventory-service:
  #   build: ../erp-service-inventory  # 🌟 Looks UP one folder, then INTO the service folder
  #   container_name: erp-inventory-service
  #   ports:
  #     - "8083:8083"
  #   environment:
  #     - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD} # Passes the .env password to Spring
  #   depends_on:
  #     - postgres
  #     - kafka
  #   networks:
  #     - erp-network

  # Example: Compliance Service
  # compliance-service:
  #   build: ../erp-service-compliance
  #   container_name: erp-compliance-service
  #   ports:
  #     - "8084:8084"
  #   environment:
  #     - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@erp-mongodb:27017/erp_audit_db?authSource=admin
  #   depends_on:
  #     - erp-mongodb
  #     - kafka
  #   networks:
  #     - erp-network

  # ==========================================
  # 🌐 API GATEWAY
  # ==========================================
  api-gateway:
    build: ../erp-api-gateway
    container_name: erp-api-gateway
    ports:
      - "8090:8090"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
    depends_on:
      - keycloak
    networks:
      - erp-network

  # ==========================================
  # 📦 PROCUREMENT SERVICE
  # ==========================================
  procurement-service:
    build: ../erp-service-procurement
    container_name: erp-procurement-service
    ports:
      - "8087:8087"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/erp_db
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - KEYCLOAK_URL=http://keycloak:8080
      - KAFKA_URL=kafka:29092
    depends_on:
      - postgres
      - kafka
      - keycloak
    networks:
      - erp-network

  sales-service:
    build: ../erp-service-sales
    container_name: erp-sales-service
    ports:
      - "8088:8088"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/erp_db
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_URL=kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - erp-network

  master-data-service:
    build: ../erp-service-master-data
    container_name: erp-master-data-service
    ports:
      - "8089:8089"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/erp_db
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - erp-network

  # ==========================================
  # 📊 OBSERVABILITY STACK
  # ==========================================

  # Elasticsearch (for ELK log storage)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: erp-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - erp-network

  # Logstash (log processing pipeline)
  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.0
    container_name: erp-logstash
    volumes:
      - ./monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000"
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    depends_on:
      - elasticsearch
    networks:
      - erp-network

  # Kibana (log visualization)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: erp-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - erp-network

  # Jaeger (distributed tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: erp-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # Jaeger collector
      - "6831:6831/udp" # Jaeger agent
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - erp-network

  # Prometheus (metrics collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: erp-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - erp-network

  # Grafana (dashboards & visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: erp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  postgres_data:
  erp_mongo_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data: