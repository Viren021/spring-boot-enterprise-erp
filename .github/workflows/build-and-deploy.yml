name: Build & Deploy ERP Services

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build API Gateway
      run: |
        cd ai-erp-system/erp-api-gateway
        mvn clean package -DskipTests

    - name: Build Procurement Service
      run: |
        cd ai-erp-system/erp-service-procurement
        mvn clean package -DskipTests

    - name: Build HR Service
      run: |
        cd ai-erp-system/erp-service-hr
        mvn clean package -DskipTests

    - name: Build Finance Service
      run: |
        cd ai-erp-system/erp-service-finance
        mvn clean package -DskipTests

    - name: Build Inventory Service
      run: |
        cd ai-erp-system/erp-service-inventory
        mvn clean package -DskipTests

    - name: Build Compliance Service
      run: |
        cd ai-erp-system/erp-service-compliance
        mvn clean package -DskipTests

    - name: Build AI Service
      run: |
        cd ai-erp-system/erp-service-ai
        mvn clean package -DskipTests

    - name: Run unit tests
      run: |
        cd ai-erp-system/erp-service-procurement
        mvn test
      continue-on-error: true

    - name: Build Docker images
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      run: |
        docker build -t erp-api-gateway:latest ai-erp-system/erp-api-gateway/
        docker build -t erp-service-procurement:latest ai-erp-system/erp-service-procurement/

    - name: Push to Docker Hub
      if: github.ref == 'refs/heads/main'
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker tag erp-api-gateway:latest ${{ secrets.DOCKER_USERNAME }}/erp-api-gateway:latest
        docker tag erp-service-procurement:latest ${{ secrets.DOCKER_USERNAME }}/erp-service-procurement:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/erp-api-gateway:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/erp-service-procurement:latest

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scan (API Gateway)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'erp-api-gateway:latest'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: Run Trivy vulnerability scan (Procurement)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'erp-service-procurement:latest'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
